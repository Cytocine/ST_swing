<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161c"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- candlesticks -->
  <g stroke-linecap="round">
    <line x1="150" y1="160" x2="150" y2="240" stroke="#ff5c6c" stroke-width="10"/>
    <rect x="128" y="180" width="44" height="44" rx="6" fill="#ff5c6c"/>

    <line x1="230" y1="200" x2="230" y2="330" stroke="#0ebb23" stroke-width="10"/>
    <rect x="208" y="230" width="44" height="70" rx="6" fill="#0ebb23"/>

    <line x1="310" y1="120" x2="310" y2="260" stroke="#0ebb23" stroke-width="10"/>
    <rect x="288" y="150" width="44" height="80" rx="6" fill="#0ebb23"/>

    <line x1="390" y1="180" x2="390" y2="300" stroke="#3ea6ff" stroke-width="10"/>
    <rect x="368" y="205" width="44" height="55" rx="6" fill="#3ea6ff"/>
  </g>
  <!-- trend line -->
  <polyline points="110,360 200,330 280,300 360,260 420,190" fill="none" stroke="#e8b74b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
